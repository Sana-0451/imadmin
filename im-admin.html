<script>
// ------- nav config -------
const NAV = [
  { key: "dashboard", label: "数据看板", icon: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z' },
  { key: "users", label: "用户管理", isGroup: true, icon: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
    children: [
      { key: "users", label: "用户列表" },
      { key: "logs", label: "登录日志" },
      { key: "roles", label: "IM 用户角色" },
    ]},
  { key: "chat", label: "聊天管理", icon: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z' },
  { key: "wallet", label: "钱包管理", icon: 'M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5M18 12a2 2 0 0 0 0 4h4v-4z' },
  { key: "system", label: "系统配置", icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' },
  { key: "admin", label: "管理员管理", icon: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' },
];

let openGroup = "users";
let active = "dashboard";
let collapsed = false;

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  NAV.forEach(item => {
    const wrap = document.createElement('div');
    const childActive = item.children && item.children.some(c => c.key === active);
    const selfActive = active === item.key;
    const btn = document.createElement('button');
    btn.className = `nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-[14px] font-medium transition ${ (selfActive||childActive) ? 'active' : 'text-slate-600 hover:bg-slate-50'}`;
    btn.innerHTML = `
      <svg class="icon shrink-0" viewBox="0 0 24 24"><path d="${item.icon}"/></svg>
      ${!collapsed ? `<span class="flex-1 text-left">${item.label}</span>` : ''}
      ${(!collapsed && item.isGroup) ? `<svg class="icon opacity-60" style="width:16px;height:16px" viewBox="0 0 24 24">${openGroup===item.key ? '<polyline points="6 9 12 15 18 9"/>' : '<polyline points="9 18 15 12 9 6"/>'}</svg>` : ''}
    `;
    btn.onclick = () => {
      if (item.isGroup) {
        openGroup = openGroup === item.key ? '' : item.key;
        if (collapsed) { collapsed = false; document.getElementById('sidebar').classList.remove('w-[76px]'); document.getElementById('sidebar').classList.add('w-[240px]'); }
        renderNav();
      } else {
        setActive(item.key);
      }
    };
    wrap.appendChild(btn);

    if (!collapsed && item.children && openGroup === item.key) {
      const sub = document.createElement('div');
      sub.className = 'ml-[27px] mt-1 space-y-0.5 border-l border-slate-100 pl-3';
      item.children.forEach(c => {
        const cbtn = document.createElement('button');
        cbtn.className = `subnav-item w-full text-left px-3 py-2 rounded-lg text-[13.5px] transition ${active===c.key ? 'active' : 'text-slate-500 hover:bg-slate-50'}`;
        cbtn.textContent = c.label;
        cbtn.onclick = () => setActive(c.key);
        sub.appendChild(cbtn);
      });
      wrap.appendChild(sub);
    }
    nav.appendChild(wrap);
  });
}

function setActive(key) {
  active = key;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + key) || document.getElementById('page-placeholder');
  target.classList.add('active');
  renderNav();
}

document.getElementById('collapseBtn').onclick = () => {
  collapsed = !collapsed;
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('w-[240px]', !collapsed);
  sb.classList.toggle('w-[76px]', collapsed);
  renderNav();
};

document.getElementById('themeBtn').onclick = () => {
  document.body.classList.toggle('dark-mode');
};

function pill(text, tone) {
  const tones = { green:'background:#ecfdf5;color:#059669', slate:'background:#f1f5f9;color:#64748b', red:'background:#fff1f2;color:#f43f5e', blue:'background:#eff6ff;color:#2563eb' };
  return `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium" style="${tones[tone]}">${text}</span>`;
}

function tick() {

  document.getElementById('clock').textContent = `2026/07/26 ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
}
